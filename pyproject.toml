[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixmatch"
version = "0.7.0"
description = "Read-only desktop tool to find duplicate and near-duplicate images and videos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Randall Quesada" }]
keywords = ["duplicate", "images", "video", "perceptual-hash", "deduplication", "photos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.11.2,<7",
    "Pillow>=12.3.0",
    "Send2Trash>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/randallquesadaa/PixMatch"
Repository = "https://github.com/randallquesadaa/PixMatch"
Issues = "https://github.com/randallquesadaa/PixMatch/issues"

[project.optional-dependencies]
video = ["imageio-ffmpeg>=0.5"]
heif = ["pillow-heif>=0.16"]
avif = ["pillow-avif-plugin>=1.4"]
ai = ["open-clip-torch>=2.20", "torch>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-github-actions-annotate-failures>=0.2",
    "ruff>=0.6",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "pyinstaller>=6.0",
]

[project.gui-scripts]
pixmatch = "app.main:main"

[project.scripts]
pixmatch-cli = "app.main:main"

[tool.setuptools]
packages = ["app", "app.core", "app.database", "app.ui", "app.ui.widgets", "app.workers", "app.utils"]

[tool.setuptools.package-data]
app = ["../packaging/resources/*.png", "resources/*.json"]

# ─────────────────────────── tests ───────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: tests that take noticeably longer (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/ui/*", "*/__init__.py"]

[tool.coverage.report]
skip_covered = false
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# ─────────────────────────── lint / format ───────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "build", "dist", "packaging/*.spec"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "PIE",      # flake8-pie
    "RUF",      # ruff-specific
    "PLC", "PLE",  # pylint (safe subset)
    "TID",      # tidy imports
]
ignore = [
    "E501",     # line length is enforced by the formatter; residual long lines are deliberate
    "RUF001", "RUF002", "RUF003",  # "ambiguous" unicode = Spanish UI text, intentional
    "SIM105",   # `contextlib.suppress` is not always clearer than try/except/pass
    "B008",     # function call in argument defaults (used for Qt/dataclass factories)
    "PLC0415",  # imports are deliberately lazy (optional deps, fast startup, avoid Qt import at module load)
    "UP042",    # `str, Enum` is intentional (stable JSON/DB serialisation across 3.11-3.13)
    "B905",     # `zip(strict=)` — parallel iterables here are constructed to the same length
    "UP031",    # a handful of printf-style strings kept for readability
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B011", "SIM", "PLC", "ARG", "RUF059"]
"scripts/**" = ["T201", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ─────────────────────────── security ───────────────────────────
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
# B404/B603/B607: PixMatch shells out to ffmpeg/ffprobe by design, with a
# resolved absolute path and a fixed argument list (never shell=True).
skips = ["B404", "B603", "B607"]
