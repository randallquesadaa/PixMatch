name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call: # let the release workflow gate on a full CI run

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  # ─────────────────────────── code standards ───────────────────────────
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "ruff>=0.6,<1"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check --diff .

  # ─────────────────────────── security ───────────────────────────
  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + security tools
        run: |
          python -m pip install -e .
          python -m pip install "bandit[toml]>=1.7" "pip-audit>=2.7"
      - name: bandit (static analysis, fail on medium+)
        run: bandit -c pyproject.toml -r app --severity-level medium
      - name: bandit (full report, informational)
        if: always()
        run: bandit -c pyproject.toml -r app -f txt || true
      - name: pip-audit (known CVEs in installed dependencies)
        run: pip-audit --desc on --skip-editable

  # ─────────────────────────── tests ───────────────────────────
  test:
    name: Tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # FFmpeg + ffprobe so the video-analysis tests actually run (they skip if absent)
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      # System libraries Qt needs to initialise even the offscreen platform plugin
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Install PixMatch (with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: >
          pytest
          --cov=app --cov-branch --cov-report=xml --cov-report=term-missing
          --junitxml=junit-${{ matrix.os }}-${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            junit-*.xml
            coverage.xml
          retention-days: 14

  # ─────────────────── one green check to gate merges on ───────────────────
  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, security, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "security=${{ needs.security.result }}"
          echo "test=${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = "success" \
            && test "${{ needs.security.result }}" = "success" \
            && test "${{ needs.test.result }}" = "success"
